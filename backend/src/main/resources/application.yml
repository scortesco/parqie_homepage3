spring:
  application:
    name: parqie-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parqie}
    username: ${DB_USER:parqie}
    password: ${DB_PASSWORD:parqie}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

parqie:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
